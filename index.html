
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJAY BATTLE ARENA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center;overflow:hidden}
header{padding:12px;background:#17253b;color:#ffd54a;font-size:22px;font-weight:bold}
#stats{display:flex;justify-content:space-around;padding:10px;font-weight:bold}
canvas{display:block;width:100%;height:62vh;background:#202f37;touch-action:none}
#controls{display:flex;justify-content:space-around;align-items:center;padding:12px}
button{border:0;border-radius:12px;padding:15px;background:#ffc928;color:#151515;font-weight:bold;font-size:16px}
#fire{background:#fa4141;color:white;width:85px;height:70px;border-radius:50%}
#message{position:absolute;top:40%;left:0;width:100%;font-size:25px;font-weight:bold;text-shadow:2px 2px #000;pointer-events:none}
</style>
</head>
<body>
<header>⚔️ AJAY BATTLE ARENA</header>
<div id="stats">
<span>❤️ HP: <b id="hp">100</b></span>
<span>⭐ Score: <b id="score">0</b></span>
<span>🌊 Wave: <b id="wave">1</b></span>
</div>
<canvas id="game"></canvas>
<div id="message">TAP START TO PLAY</div>
<div id="controls">
<button id="left">◀ LEFT</button>
<button id="start">START / RESTART</button>
<button id="right">RIGHT ▶</button>
<button id="fire">🔥 FIRE</button>
</div>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
const hpText=document.getElementById("hp"),scoreText=document.getElementById("score"),waveText=document.getElementById("wave"),msg=document.getElementById("message");
let W=0,H=0,player,enemies=[],bullets=[],score=0,hp=100,wave=1,running=false,move=0,last=0,spawn=0;
function resize(){
const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);
ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;
if(!player)player={x:W/2,y:H-55};
player.x=Math.max(20,Math.min(W-20,player.x));
}
addEventListener("resize",resize);resize();
function startGame(){
player={x:W/2,y:H-55};enemies=[];bullets=[];score=0;hp=100;wave=1;spawn=0;running=true;msg.style.display="none";updateStats();last=performance.now();requestAnimationFrame(loop);
}
function updateStats(){hpText.textContent=hp;scoreText.textContent=score;waveText.textContent=wave}
function drawPlayer(){
ctx.fillStyle="#47d9ff";ctx.beginPath();ctx.moveTo(player.x,player.y-18);ctx.lineTo(player.x-15,player.y+15);ctx.lineTo(player.x+15,player.y+15);ctx.closePath();ctx.fill();
ctx.fillStyle="white";ctx.fillRect(player.x-4,player.y+5,8,8);
}
function loop(now){
if(!running)return;
let dt=Math.min((now-last)/16,2);last=now;
ctx.clearRect(0,0,W,H);
ctx.fillStyle="#263b43";ctx.fillRect(0,0,W,H);
ctx.strokeStyle="#304b53";ctx.lineWidth=1;
for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
player.x=Math.max(18,Math.min(W-18,player.x+move*4*dt));
spawn-=dt;
if(spawn<=0){enemies.push({x:20+Math.random()*(W-40),y:-20,r:13,speed:1+wave*.18});spawn=Math.max(18,55-wave*3)}
for(let i=bullets.length-1;i>=0;i--){
let b=bullets[i];b.y-=8*dt;
ctx.fillStyle="#ffe45c";ctx.fillRect(b.x-3,b.y-9,6,12);
if(b.y<0)bullets.splice(i,1);
}
for(let i=enemies.length-1;i>=0;i--){
let e=enemies[i];e.y+=e.speed*dt;
ctx.fillStyle="#ff5353";ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#fff";ctx.fillRect(e.x-4,e.y-4,8,8);
if(Math.hypot(e.x-player.x,e.y-player.y)<25){enemies.splice(i,1);hp-=15;updateStats();if(hp<=0){endGame();return}}
else if(e.y>H){enemies.splice(i,1);hp-=5;updateStats();if(hp<=0){endGame();return}}
else{
for(let j=bullets.length-1;j>=0;j--){
if(Math.hypot(e.x-bullets[j].x,e.y-bullets[j].y)<e.r+5){
enemies.splice(i,1);bullets.splice(j,1);score+=10;
wave=1+Math.floor(score/100);updateStats();break;
}}
}
}
drawPlayer();
requestAnimationFrame(loop);
}
function endGame(){running=false;msg.innerHTML="GAME OVER<br>Score: "+score+"<br>Press RESTART";msg.style.display="block"}
function fire(){if(running)bullets.push({x:player.x,y:player.y-18})}
document.getElementById("start").onclick=startGame;
document.getElementById("fire").onclick=fire;
document.getElementById("left").onpointerdown=()=>move=-1;
document.getElementById("right").onpointerdown=()=>move=1;
for(const id of ["left","right"]){
const el=document.getElementById(id);
el.onpointerup=el.onpointercancel=el.onpointerleave=()=>move=0;
}
c.addEventListener("pointerdown",e=>{if(running){const r=c.getBoundingClientRect();player.x=e.clientX-r.left;fire()}});
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move=-1;if(e.key==="ArrowRight")move=1;if(e.key===" ")fire()});
addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight")move=0});
</script>
</body>
</html>
