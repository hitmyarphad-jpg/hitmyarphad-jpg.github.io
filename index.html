
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJAY BATTLE ARENA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center}
header{padding:16px;color:#ffd54a;font-size:23px;font-weight:bold}
#stats{display:flex;justify-content:space-around;padding:10px}
canvas{display:block;width:100%;height:55vh;background:#20343c;touch-action:manipulation}
#controls{display:flex;justify-content:space-around;align-items:center;gap:5px;padding:12px;flex-wrap:wrap}
button{padding:14px 12px;border:0;border-radius:12px;background:#ffd43b;font-weight:bold;font-size:15px}
#fire{background:#ff4141;color:white;border-radius:50%;width:75px;height:75px}
#msg{padding:8px;color:#ffd43b;font-weight:bold}
</style>
</head>
<body>
<header>⚔️ AJAY BATTLE ARENA</header>
<div id="stats">
<span>❤️ HP: <b id="hp">100</b></span>
<span>⭐ Score: <b id="score">0</b></span>
<span>🌊 Wave: <b id="wave">1</b></span>
</div>
<canvas id="game"></canvas>
<div id="msg">START दबाकर गेम खेलो!</div>
<div id="controls">
<button id="left">◀ LEFT</button>
<button id="start">START / RESTART</button>
<button id="right">RIGHT ▶</button>
<button id="fire">🔥 FIRE</button>
</div>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let W,H,p,foes,shots,score,hp,wave,running,move,last,spawn;
function resize(){
W=c.clientWidth;H=c.clientHeight;
c.width=W;c.height=H;
if(!p)p={x:W/2,y:H-40};
}
window.addEventListener("resize",resize);resize();
function start(){
resize();p={x:W/2,y:H-40};foes=[];shots=[];
score=0;hp=100;wave=1;move=0;spawn=0;running=true;
document.getElementById("msg").textContent="दुश्मनों को मारो!";
last=performance.now();stats();requestAnimationFrame(loop);
}
function stats(){
document.getElementById("hp").textContent=hp;
document.getElementById("score").textContent=score;
document.getElementById("wave").textContent=wave;
}
function fire(){if(running)shots.push({x:p.x,y:p.y-15})}
function loop(t){
if(!running)return;
let d=Math.min((t-last)/16,2);last=t;
ctx.clearRect(0,0,W,H);
ctx.fillStyle="#20343c";ctx.fillRect(0,0,W,H);
ctx.strokeStyle="#2b4851";
for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
p.x=Math.max(15,Math.min(W-15,p.x+move*4*d));
if(--spawn<=0){foes.push({x:15+Math.random()*(W-30),y:-15});spawn=Math.max(15,50-wave*2)}
for(let i=shots.length-1;i>=0;i--){
let b=shots[i];b.y-=8*d;ctx.fillStyle="#ffe45c";ctx.fillRect(b.x-3,b.y-8,6,12);
if(b.y<0)shots.splice(i,1);
}
for(let i=foes.length-1;i>=0;i--){
let e=foes[i];e.y+=(1+wave*.15)*d;
ctx.fillStyle="#ff5151";ctx.beginPath();ctx.arc(e.x,e.y,12,0,7);ctx.fill();
let hit=shots.findIndex(b=>Math.hypot(b.x-e.x,b.y-e.y)<17);
if(hit>=0){shots.splice(hit,1);foes.splice(i,1);score+=10;wave=1+Math.floor(score/100);stats();continue}
if(Math.hypot(e.x-p.x,e.y-p.y)<22||e.y>H){
foes.splice(i,1);hp-=10;stats();
if(hp<=0){running=false;document.getElementById("msg").textContent="GAME OVER! Score: "+score+" — RESTART दबाओ";return}
}
}

ctx.fillStyle="#47d9ff";
ctx.fillRect(p.x-10,p.y-5,20,18);
ctx.fillStyle="#ffcc99";
ctx.fillRect(p.x-7,p.y-17,14,12);
ctx.fillStyle="#263238";
ctx.fillRect(p.x-8,p.y-20,16,6);
ctx.fillStyle="#ffffff";
ctx.fillRect(p.x-5,p.y-13,3,3);
ctx.fillRect(p.x+2,p.y-13,3,3);
ctx.fillStyle="#ff4545";
ctx.fillRect(p.x-13,p.y+2,6,12);
ctx.fillRect(p.x+7,p.y+2,6,12);
ctx.fillStyle="#263238";
ctx.fillRect(p.x-9,p.y+13,7,9);
ctx.fillRect(p.x+2,p.y+13,7,9);

requestAnimationFrame(loop);
}
document.getElementById("start").onclick=start;
document.getElementById("fire").onclick=fire;
document.getElementById("left").onpointerdown=()=>move=-1;
document.getElementById("right").onpointerdown=()=>move=1;
["left","right"].forEach(id=>{
let b=document.getElementById(id);
b.onpointerup=b.onpointercancel=b.onpointerleave=()=>move=0;
});
c.addEventListener("pointerdown",e=>{
if(running){p.x=e.clientX-c.getBoundingClientRect().left;fire()}
});
window.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft")move=-1;
if(e.key==="ArrowRight")move=1;
if(e.key===" ")fire();
});
window.addEventListener("keyup",()=>move=0);
</script>
</body>
</html>
